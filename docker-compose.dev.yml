version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: chpli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chpli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chpli_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chpli}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chpli}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chpli-network

  # 数据库迁移服务
  db-migrate:
    image: node:20-alpine
    container_name: chpli-db-migrate
    working_dir: /app/apps/calendar-memo/server
    command: >
      sh -c "
        set -e &&
        echo '========================================' &&
        echo '  Calendar Memo 数据迁移工具 (Dev)' &&
        echo '========================================' &&
        echo '' &&
        echo '⏳ 等待数据库就绪...' &&
        apk add --no-cache postgresql-client &&
        until pg_isready -h postgres -U ${POSTGRES_USER:-chpli} > /dev/null 2>&1; do
          echo '  等待 PostgreSQL...'
          sleep 2
        done &&
        echo '✅ 数据库已就绪' &&
        echo '' &&
        echo '⏳ 安装依赖...' &&
        npm install -g pnpm &&
        pnpm install &&
        echo '✅ 依赖安装完成' &&
        echo '' &&
        echo '⏳ 生成 Prisma Client...' &&
        node ./node_modules/prisma/build/index.js generate &&
        echo '✅ Prisma Client 生成完成' &&
        echo '' &&
        echo '⏳ 运行数据迁移脚本...' &&
        echo '' &&
        node ./node_modules/tsx/dist/cli.mjs scripts/migrate-memo-completions.ts &&
        echo '' &&
        echo '✅ 所有操作已完成'
      "
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chpli}:${POSTGRES_PASSWORD:-chpli_secret}@postgres:5432/${POSTGRES_DB:-chpli}?schema=public
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/calendar-memo/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chpli-network
    profiles:
      - migrate
    restart: "no"

  # User Manager - 统一用户认证服务 (开发模式)
  user-manager:
    image: node:20-alpine
    container_name: chpli-user-manager
    working_dir: /app/apps/user-manager/server
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm install &&
        node ./node_modules/prisma/build/index.js generate &&
        node ./node_modules/prisma/build/index.js db push --accept-data-loss &&
        node ./node_modules/tsx/dist/cli.mjs watch src/index.ts
      "
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chpli}:${POSTGRES_PASSWORD:-chpli_secret}@postgres:5432/${POSTGRES_DB:-chpli}?schema=public
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    ports:
      - "${USER_MANAGER_PORT:-3002}:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/user-manager/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chpli-network

  # Calendar Memo - Backend Server (开发模式)
  calendar-memo-server:
    image: node:20-alpine
    container_name: chpli-calendar-memo-server
    working_dir: /app/apps/calendar-memo/server
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm install &&
        node ./node_modules/prisma/build/index.js generate &&
        node ./node_modules/prisma/build/index.js db push --accept-data-loss &&
        node ./node_modules/tsx/dist/cli.mjs watch src/index.ts
      "
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chpli}:${POSTGRES_PASSWORD:-chpli_secret}@postgres:5432/${POSTGRES_DB:-chpli}?schema=public
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    ports:
      - "${CALENDAR_MEMO_SERVER_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/calendar-memo/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      user-manager:
        condition: service_started
    networks:
      - chpli-network

  # Calendar Memo - Web 前端 (开发模式)
  calendar-memo-web:
    image: node:20-alpine
    container_name: chpli-calendar-memo-web
    working_dir: /app/apps/calendar-memo/web
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm install --ignore-workspace &&
        node ./node_modules/vite/bin/vite.js --host
      "
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://calendar-memo-server:3001
      - VITE_AUTH_API_TARGET=http://user-manager:3002
      - VITE_UPLOADS_TARGET=http://calendar-memo-server:3001
    ports:
      - "${CALENDAR_MEMO_WEB_PORT:-5175}:5175"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/calendar-memo/web/node_modules
    depends_on:
      - calendar-memo-server
      - user-manager
    networks:
      - chpli-network

  # Bookmark Manager - Backend Server (开发模式)
  bookmark-manager-server:
    image: python:3.12-slim
    container_name: chpli-bookmark-manager-server
    working_dir: /app/apps/bookmark-manager/server
    command: sh -c "pip install -r requirements.txt --timeout 120 --retries 5 && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chpli}:${POSTGRES_PASSWORD:-chpli_secret}@postgres:5432/${POSTGRES_DB:-chpli}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
    ports:
      - "${BOOKMARK_MANAGER_SERVER_PORT:-8001}:8001"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chpli-network

  # Bookmark Manager - Web 前端 (开发模式)
  bookmark-manager-web:
    image: node:20-alpine
    container_name: chpli-bookmark-manager-web
    working_dir: /app/apps/bookmark-manager/web
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm install --ignore-workspace &&
        node ./node_modules/vite/bin/vite.js --host
      "
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://bookmark-manager-server:8001
      - VITE_AUTH_API_TARGET=http://user-manager:3002
    ports:
      - "${BOOKMARK_MANAGER_WEB_PORT:-5174}:5174"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/bookmark-manager/web/node_modules
    depends_on:
      - bookmark-manager-server
      - user-manager
    networks:
      - chpli-network

  # Portal - 统一入口前端 (开发模式)
  portal-web:
    image: node:20-alpine
    container_name: chpli-portal-web
    working_dir: /app/apps/portal/web
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm install --ignore-workspace &&
        node ./node_modules/vite/bin/vite.js --host
      "
    environment:
      - NODE_ENV=development
      - VITE_AUTH_API_TARGET=http://user-manager:3002
      - VITE_CALENDAR_URL=http://localhost:5175
      - VITE_BOOKMARK_URL=http://localhost:5174
    ports:
      - "${PORTAL_WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/portal/web/node_modules
    depends_on:
      - user-manager
      - calendar-memo-web
      - bookmark-manager-web
    networks:
      - chpli-network

volumes:
  postgres_data:
    name: chpli_postgres_data

networks:
  chpli-network:
    name: chpli-network
    driver: bridge
